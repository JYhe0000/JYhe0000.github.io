# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: JYhe
subtitle: ''
description: 'JYhe 的个人博客'
keywords:
author: JYhe
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://jianyuanhe.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: false
highlight:
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: false
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'date'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: shokax

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:JYhe0000/jianyuanhe.github.io.git
  branch: main

# Feed (shokaX templates)
feed:
  limit: 20
  order_by: '-date'
  tag_dir: false
  category_dir: false
  rss:
    enable: true
    template: 'node_modules/hexo-theme-shokax/layout/_alternate/rss.ejs'
    output: 'rss.xml'
  atom:
    enable: true
    template: 'node_modules/hexo-theme-shokax/layout/_alternate/atom.ejs'
    output: 'atom.xml'
  jsonFeed:
    enable: true
    template: 'node_modules/hexo-theme-shokax/layout/_alternate/json.ejs'
    output: 'feed.json'

# Minify (hexo-lightning-minify, shokaX recommended: css only)
minify:
  js:
    enable: false
  css:
    enable: true
    options:
      targets: '>= 0.5%'
  html:
    enable: false
  image:
    enable: false
